server:
  port: 9000

spring:
  application:
    name: yimiao-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: yimiao-user
          uri: http://localhost:8083
          predicates:
            - Path=/api/user/**,/api/cert/**,/api/vaccinee/**,/api/sms/**
          filters:
            - StripPrefix=1
            
        - id: yimiao-vaccine
          uri: http://localhost:8085
          predicates:
            - Path=/api/vaccine/**,/api/stock/**,/api/slot/**,/api/site/**
          filters:
            - StripPrefix=1
            
        - id: yimiao-appointment
          uri: http://localhost:8087
          predicates:
            - Path=/api/appointment/**,/api/blacklist/**,/api/risk/**
          filters:
            - StripPrefix=1
            
        - id: yimiao-payment
          uri: http://localhost:8089
          predicates:
            - Path=/api/payment/**,/api/refund/**,/api/notification/**
          filters:
            - StripPrefix=1
            
        - id: yimiao-admin
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/**,/api/statistics/**
          filters:
            - StripPrefix=1
            
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 10000ms

logging:
  level:
    com.yimiao: info
    org.springframework.cloud.gateway: info

management:
  endpoints:
    web:
      exposure:
        include: "*"
