server:
  port: 8083

spring:
  application:
    name: yimiao-user
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test_ym_1?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: test
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 10000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.yimiao.user.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: yimiao-vaccine-appointment-system-secret-key-2024
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    com.yimiao: info
    org.springframework: info

knife4j:
  enable: true
  setting:
    language: zh-CN
